<style>
/* ============ THEMES ============ */
:root, [data-theme="default"]{
  --bg:#0c0e0f; --panel:#121517; --panel-2:#161a1c;
  --border:#22282b; --border-bright:#5ee6d0;
  --cyan:#5ee6d0; --amber:#f0b35e; --green:#7ee787; --red:#ff6b6b;
  --magenta:#c792ea;
  --grey:#7b8389; --grey-dim:#52585c; --white:#e9edee;
  --on-primary:#06231e;
}
[data-theme="light"]{
  --bg:#f4f6f7; --panel:#ffffff; --panel-2:#eef1f3;
  --border:#d6dbdf; --border-bright:#0e8c7a;
  --cyan:#0e8c7a; --amber:#b26a00; --green:#1e8e3e; --red:#d93025;
  --magenta:#8e44ad;
  --grey:#5f6368; --grey-dim:#9aa0a6; --white:#1a1d1f;
  --on-primary:#ffffff;
}
[data-theme="nord"]{ --bg:#2e3440; --panel:#3b4252; --panel-2:#434c5e; --border:#4c566a; --border-bright:#88c0d0; --cyan:#88c0d0; --amber:#ebcb8b; --green:#a3be8c; --red:#bf616a; --magenta:#b48ead; --grey:#81a1c1; --grey-dim:#616e88; --white:#eceff4; --on-primary:#2e3440; }
[data-theme="dracula"]{ --bg:#191a21; --panel:#21222c; --panel-2:#282a36; --border:#44475a; --border-bright:#bd93f9; --cyan:#8be9fd; --amber:#f1fa8c; --green:#50fa7b; --red:#ff5555; --magenta:#ff79c6; --grey:#6272a4; --grey-dim:#4a5374; --white:#f8f8f2; --on-primary:#191a21; }
[data-theme="gruvbox"]{ --bg:#1d2021; --panel:#282828; --panel-2:#32302f; --border:#3c3836; --border-bright:#83a598; --cyan:#83a598; --amber:#fabd2f; --green:#b8bb26; --red:#fb4934; --magenta:#d3869b; --grey:#a89984; --grey-dim:#665c54; --white:#ebdbb2; --on-primary:#1d2021; }
[data-theme="catppuccin"]{ --bg:#11111b; --panel:#1e1e2e; --panel-2:#181825; --border:#313244; --border-bright:#cba6f7; --cyan:#89dceb; --amber:#f9e2af; --green:#a6e3a1; --red:#f38ba8; --magenta:#f5c2e7; --grey:#a6adc8; --grey-dim:#6c7086; --white:#cdd6f4; --on-primary:#11111b; }
[data-theme="tokyonight"]{ --bg:#1a1b26; --panel:#1f2335; --panel-2:#24283b; --border:#2f334d; --border-bright:#7aa2f7; --cyan:#7dcfff; --amber:#e0af68; --green:#9ece6a; --red:#f7768e; --magenta:#bb9af7; --grey:#a9b1d6; --grey-dim:#565f89; --white:#c0caf5; --on-primary:#1a1b26; }
[data-theme="rosepine"]{ --bg:#191724; --panel:#1f1d2e; --panel-2:#26233a; --border:#403d52; --border-bright:#ebbcba; --cyan:#9ccfd8; --amber:#f6c177; --green:#31748f; --red:#eb6f92; --magenta:#c4a7e7; --grey:#908caa; --grey-dim:#6e6a86; --white:#e0def4; --on-primary:#191724; }
[data-theme="onedark"]{ --bg:#21252b; --panel:#282c34; --panel-2:#2c313a; --border:#3b4048; --border-bright:#61afef; --cyan:#56b6c2; --amber:#e5c07b; --green:#98c379; --red:#e06c75; --magenta:#c678dd; --grey:#abb2bf; --grey-dim:#5c6370; --white:#dcdfe4; --on-primary:#21252b; }
[data-theme="solarized"]{ --bg:#fdf6e3; --panel:#eee8d5; --panel-2:#e7e0c9; --border:#d5cdb6; --border-bright:#268bd2; --cyan:#268bd2; --amber:#b58900; --green:#859900; --red:#dc322f; --magenta:#d33682; --grey:#657b83; --grey-dim:#93a1a1; --white:#073642; --on-primary:#fdf6e3; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;padding:0;background:var(--bg);overflow-x:clip}
body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:"JetBrains Mono","IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;min-height:100vh;overscroll-behavior-y:none;overflow-x:clip;max-width:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb, var(--cyan) 5%, transparent),transparent 60%)}
#app{position:relative;z-index:1;min-height:100vh;overflow-x:clip}

.term{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 0 0 1px color-mix(in srgb, var(--cyan) 4%, transparent),0 10px 30px -10px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column;width:100%}
.titlebar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;transition:background .18s,box-shadow .18s}
.dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
.dot.hint{background:#4d9fff!important;box-shadow:0 0 8px rgba(77,159,255,.85)}
.titlebar .path{margin-left:6px;font-size:11px;color:var(--grey-dim);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.titlebar-back{flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--cyan);font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 10px;cursor:pointer}
.titlebar-back:active{background:color-mix(in srgb, var(--cyan) 10%, transparent)}
.screen{padding:18px 16px 20px;flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--white);font-family:inherit;font-size:14px;font-weight:600;padding:13px 16px;cursor:pointer;width:100%;transition:transform .08s,border-color .15s,opacity .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--cyan);color:var(--on-primary);border-color:var(--cyan)}
.btn-danger{background:transparent;color:var(--red);border-color:color-mix(in srgb, var(--red) 40%, var(--border))}
.btn-ghost{background:transparent;color:var(--grey);border-color:var(--border)}
.btn.sm{width:auto;padding:8px 12px;font-size:12.5px}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1;width:auto}
.menu{display:flex;flex-direction:column;gap:8px}
.menu-item{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 11px;cursor:pointer;transition:border-color .15s,transform .08s;text-align:left;color:var(--white);font-family:inherit;font-size:14px;width:100%;text-decoration:none}
.menu-item:active{transform:scale(.985)}
.menu-item:hover{border-color:var(--border-bright)}
.menu-item .mk{color:var(--cyan);font-weight:700;width:10px;flex-shrink:0;visibility:hidden}
.menu-item.active .mk{visibility:visible}
.menu-item .num{color:var(--cyan);font-weight:700;min-width:22px;flex-shrink:0}
.menu-item .label{flex:1;line-height:1.3}
.menu-item .meta{color:var(--grey-dim);font-size:11.5px;flex-shrink:0}
.menu-item.active{border-color:var(--border-bright)}
.menu-item.active .label{color:var(--cyan)}
.menu-item.admin .num,.menu-item.admin .label{color:var(--amber)}
.menu-item.accent .num,.menu-item.accent .label{color:var(--green)}
.menu-item.on{border-color:var(--border-bright)}
.menu-item.on .label{color:var(--cyan)}
hr.div{border:none;border-top:1px solid var(--border);margin:14px 0}

.shell{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;align-self:flex-start;position:sticky;top:0;height:100vh;padding:14px 0 14px 14px;z-index:60}
.sb-term{height:100%}
.sb-screen{padding:14px 12px 14px}
.sb-spacer{flex:1;min-height:12px}
.main{flex:1;min-width:0;padding:0 22px 40px}
.main-inner{max-width:760px;margin:0 auto}
.menu-btn{display:none}
.sb-backdrop{display:none}
.top-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:18px 0 14px;border-bottom:1px solid var(--border);margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .kite{font-size:20px;font-weight:700;color:var(--cyan);letter-spacing:.2em}
.brand .sub{font-size:11px;color:var(--grey-dim);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.user-area{min-width:0;margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--grey)}
.user-area .name{color:var(--white);font-weight:600;display:inline-block;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-family:inherit;font-size:11.5px;color:var(--cyan);background:transparent;cursor:pointer}
.tag:hover{border-color:var(--border-bright)}

.bell{position:relative;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--cyan);font-family:inherit;font-size:13px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.bell:hover{border-color:var(--border-bright)}
.bell .nb{background:var(--red);color:var(--white);border-radius:10px;font-size:10px;font-weight:700;padding:1px 5px;min-width:14px;text-align:center;line-height:1.3}

.search-wrap{position:relative;margin-bottom:14px}
.search-wrap .prompt{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--cyan);font-weight:700;pointer-events:none}
.search-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:inherit;font-size:14.5px;padding:13px 13px 13px 32px}
.search-input:focus{outline:none;border-color:var(--cyan)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--grey);border-radius:20px;padding:7px 14px;font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.active{background:color-mix(in srgb, var(--cyan) 12%, transparent);color:var(--cyan);border-color:var(--cyan)}
.chip:hover{border-color:var(--border-bright)}

h1.page-title{font-size:18px;margin:6px 0 14px;color:var(--amber);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.cursor{display:inline-block;width:9px;height:16px;background:var(--amber);animation:blink 1.1s steps(1) infinite;vertical-align:-3px}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.subject-head{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--amber);margin:30px 0 12px;display:flex;align-items:baseline;gap:8px;text-transform:lowercase}
.subject-head .prompt{color:var(--cyan)}
.subject-head .cnt{color:var(--grey-dim);font-weight:500;font-size:11px}
section:first-of-type>.subject-head{margin-top:8px}
.sec-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin:28px 0 12px}
.summary{display:flex;flex-wrap:wrap;gap:8px 26px;color:var(--grey);font-size:12.5px;margin-bottom:6px}
.summary b{color:var(--cyan);font-size:22px;margin-right:8px;vertical-align:middle}
.note{color:var(--grey);font-size:12px;line-height:1.6;margin-top:14px}

.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.deck-term{transition:border-color .15s}
.deck-term:hover{border-color:var(--border-bright)}
.deck-term .titlebar .path{color:var(--cyan);font-size:12.5px;font-weight:600}
.deck-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
.kv{display:flex;gap:12px;font-size:12.5px;align-items:center;min-width:0}
.kv .k{color:var(--grey-dim);width:66px;flex-shrink:0}
.kv .v{color:var(--white);min-width:0;white-space:nowrap;display:flex;align-items:center}
.tagtxt{color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{color:var(--grey-dim)}
.hot{color:var(--cyan);font-weight:700}
.dc-flag{color:var(--amber);font-weight:700;font-size:11.5px}
.dk-actions{display:flex;gap:10px;margin-top:8px}
.dk-actions .btn{flex:1;width:auto;padding:9px 10px;font-size:12.5px}
.dc-author{display:inline-flex;align-items:center;max-width:100%;min-width:0}
.dc-author .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px}
.qa-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.stat-card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-card .n{font-size:26px;font-weight:700;color:var(--cyan);line-height:1.1}
.stat-card .l{font-size:11px;color:var(--grey);margin-top:4px}
.prof-card{display:flex;align-items:center;gap:14px}
.prof-avatar{width:56px;height:56px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prof-avatar svg{width:30px;height:30px}
.prof-avatar svg *{fill:var(--cyan)}
.prof-name{font-size:19px;font-weight:700;color:var(--white);display:flex;align-items:center;flex-wrap:wrap}
.prof-name .badge{width:20px;height:20px;margin-left:8px}
.prof-sub{color:var(--grey);font-size:12.5px;margin-top:3px;word-break:break-all}
.auth-info-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--grey)}
.auth-info-row:last-child{border-bottom:none;padding-bottom:0}
.auth-info-row .val{color:var(--white);font-weight:600;text-align:right;word-break:break-all}
.row-card{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);margin-bottom:10px}
.ar-main{flex:1;min-width:190px}
.ar-title{color:var(--white);font-weight:700;font-size:13.5px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.ar-sub{color:var(--grey);font-size:11.5px;margin-top:3px;display:flex;align-items:center;flex-wrap:wrap}
.grant-input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:inherit;font-size:13px;padding:10px 12px}
.grant-input:focus{outline:none;border-color:var(--cyan)}

.pwa-status{font-size:12px;line-height:1.8;color:var(--grey)}
.pwa-status .pn{color:var(--grey-dim)}

.badge{position:relative;display:inline-flex;width:18px;height:18px;flex-shrink:0;cursor:default;outline:none;vertical-align:middle;margin-left:4px}
.badge svg{width:100%;height:100%}
.badge::after{content:attr(data-tip);position:absolute;display:none;width:max-content;max-width:170px;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--bg);color:var(--white);border:1px solid var(--cyan);border-radius:6px;padding:4px 7px;font-family:inherit;font-size:10.5px;font-weight:500;line-height:1.3;text-align:left;white-space:normal;pointer-events:none;z-index:90}
.badge:hover::after,.badge:focus::after{display:block}
.badge.tip-up::after{top:auto;bottom:calc(100% + 6px)}
.badge.tip-down::after{bottom:auto;top:calc(100% + 6px)}
.badge.tip-l::after{left:-6px;right:auto;transform:none}
.badge.tip-r::after{right:-6px;left:auto;transform:none}
.badge.tip-c::after{left:50%;right:auto;transform:translateX(-50%)}

.home-actions{margin:0 0 14px}
.auth-field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:inherit;font-size:14px;padding:11px 12px;min-height:84px;resize:vertical}
.auth-field textarea:focus{outline:none;border-color:var(--cyan)}
.add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add-row input,.add-row textarea{flex:1;min-width:0;width:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:inherit;font-size:13px;padding:10px 11px}
.add-row textarea{min-height:64px;flex-basis:100%;resize:vertical}
.add-row input:focus,.add-row textarea:focus{outline:none;border-color:var(--cyan)}
.add-row .btn{flex-shrink:0}
.sub-block{margin-bottom:16px}
.sub-block .screen{padding:14px}
.topic-block{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px}
.topic-head{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.topic-name{color:var(--cyan);font-weight:700;font-size:13px;min-width:0;overflow-wrap:anywhere}
.topic-name .dim{font-weight:400;font-size:11px;margin-left:6px}
.mini-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey-dim);margin:10px 0 6px}
.li-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);margin-bottom:6px;font-size:12.5px}
.li-row .qa{min-width:0;flex:1;overflow-wrap:anywhere;line-height:1.5}
.li-row .q{color:var(--amber)}
.li-row .a{color:var(--grey)}
.x-btn{flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--red);font-family:inherit;font-size:11px;padding:3px 8px;cursor:pointer}
.x-btn:hover{border-color:var(--red)}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);margin-bottom:8px;font-size:13px;cursor:pointer}
.check-row input{margin-top:2px;accent-color:var(--cyan);flex-shrink:0}
.file-input{width:100%;font-family:inherit;font-size:13px;color:var(--grey);background:var(--panel-2);border:1px dashed var(--border-bright);border-radius:8px;padding:16px}
.file-input::file-selector-button{background:var(--cyan);color:var(--on-primary);border:0;border-radius:6px;padding:8px 12px;margin-right:12px;font-family:inherit;font-weight:700;cursor:pointer}
.rep-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.type-chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--border-bright);border-radius:20px;padding:2px 9px;color:var(--cyan);margin-right:8px}
.type-chip.user{color:var(--amber)}
.type-chip.import_error{color:var(--red)}
.type-chip.req_subject{color:var(--magenta)}
.type-chip.req_tag{color:var(--green)}
.report-body{flex:1;min-width:190px}
.report-detail{color:var(--grey);font-size:12px;margin-top:4px;line-height:1.5;overflow-wrap:anywhere}
.sum-line{color:var(--grey);font-size:12.5px;margin:6px 0 14px}
.sum-line b{color:var(--cyan)}
select.rep-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:inherit;font-size:14px;padding:11px 12px}
select.rep-select:focus{outline:none;border-color:var(--cyan)}

/* Tag picker */
.tag-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag-chip{background:transparent;border:1px solid var(--border);color:var(--grey);border-radius:20px;padding:6px 12px;font-family:inherit;font-size:12px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.tag-chip:hover{border-color:var(--border-bright)}

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove("show"),2200)}
function tsDate(ts){ if(!ts) return null; const d = ts.toDate ? ts.toDate() : new Date(ts); return isNaN(d) ? null : d; }
function tsMs(ts){ const d = tsDate(ts); return d ? d.getTime() : 0; }
function timeAgo(ts){
  const d = tsDate(ts); if(!d) return "—";
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if(s < 60) return "just now";
  const m = Math.floor(s / 60);    if(m < 60) return m + "m ago";
  const h = Math.floor(m / 60);    if(h < 24) return h + "h ago";
  const days = Math.floor(h / 24); if(days < 30) return days + "d ago";

}

/* ---------- dot light show ---------- */
const dotShow = (() => {
  const IDLE_MS = 90 * 1000, STEP_MS = 260, HOLD_MS = 1100, REPEAT_MS = 3000;
  const FRAMES = [[[0],STEP_MS],[[0,1],STEP_MS],[[0,1,2],HOLD_MS],[[1,2],STEP_MS],[[2],STEP_MS],[[],0]];
  let idleTimer = null, seqTimers = [], playing = false, intro = false, introPlayed = false;
  const paint = blues => document.querySelectorAll(".dot[data-dot]").forEach(d => {
    d.classList.toggle("hint", blues.includes(parseInt(d.dataset.dot, 10)));
  });
  const stop = () => { playing = false; seqTimers.forEach(clearTimeout); seqTimers = []; paint([]); };
  const playOnce = (repeat = true) => {
    let t = 0, lastAt = 0;
    FRAMES.forEach(([blues, ms]) => { const at = t; lastAt = at; seqTimers.push(setTimeout(() => paint(blues), at)); t += ms; });
    if(repeat) seqTimers.push(setTimeout(() => { if(playing){ seqTimers = []; playOnce(); } }, lastAt + REPEAT_MS));
    return lastAt;
  };
  const playIntro = () => {
    if(playing) return;
    intro = true; playing = true;
    const end = playOnce(false);
    seqTimers.push(setTimeout(() => { intro = false; playing = false; seqTimers = []; paint([]); }, end + 50));
  };
  const onActivity = () => {
    if(playing && !intro) stop();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { playing = true; playOnce(); }, IDLE_MS);
  };
  ["pointerdown","pointermove","mousemove","keydown","touchstart","wheel","scroll","click"].forEach(ev => {
    document.addEventListener(ev, onActivity, { passive: true, capture: true });
  });
  onActivity();
  return { FRAMES, maybeIntro(){ if(introPlayed || !document.querySelector(".dot[data-dot]")) return; introPlayed = true; setTimeout(playIntro, 700); } };

/* ---------- install the app ---------- */

function isStandalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }

}
function paintPwa(){
  const box = document.getElementById("pwaStatus"); if(box) box.innerHTML = pwaRows || "Checking…";
  const btn = document.getElementById("pwaInstallBtn");
  if(btn) btn.style.display = (window.__deferredInstall && !isStandalone()) ? "" : "none";
}
async function runPwaCheck(){
  const rows = [];
  const add = (ok, label, note) => rows.push(`<div><span style="color:var(--${ok ? "green" : "red"});">${ok ? "✓" : "✗"}</span> ${esc(label)}${note ? ` <span class="pn">${esc(note)}</span>` : ""}</div>`);
  if(isStandalone()){ pwaRows = `<div><span style="color:var(--green);">✓</span> Running as an installed app</div>`; paintPwa(); return; }
  add(location.protocol === "https:" || location.hostname === "localhost", "Secure connection (HTTPS)");
  const link = document.querySelector('link[rel="manifest"]');
  let man = null, manUrl = null;
  try{
    manUrl = new URL(link.getAttribute("href"), location.href).href;
    const r = await fetch(manUrl, { cache: "no-store" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    man = await r.json();
    add(true, "Manifest loads");
  }catch(e){ add(false, "Manifest loads", String((e && e.message) || e)); }
  if(man){
    add(!!(man.name || man.short_name), "Has a name");
    add(!!man.start_url, "Has start_url");
    add(["standalone","fullscreen","minimal-ui"].includes(man.display), "Display mode is app-like", man.display || "missing");
    const icons = man.icons || [];
    for(const need of [192, 512]){
      const ic = icons.find(i => /png/i.test(i.type || i.src) && (i.sizes || "").split(" ").some(z => parseInt(z, 10) === need));
      if(!ic){ add(false, need + "px PNG icon listed"); continue; }
      try{
        const r = await fetch(new URL(ic.src, manUrl).href, { cache: "no-store" });
        const ct = r.headers.get("content-type") || "";
        add(r.ok && /image\/png/i.test(ct), need + "px PNG icon loads", r.ok ? ct : "HTTP " + r.status);
      }catch(e){ add(false, need + "px PNG icon loads", "can't fetch"); }
    }
  }
  let reg = null;
  try{ reg = await navigator.serviceWorker.getRegistration(); }catch(e){}
  add(!!reg, "Service worker registered");
  add(!!(navigator.serviceWorker && navigator.serviceWorker.controller), "Service worker controlling this page", "reload once if this is ✗");
  const ready = !!window.__deferredInstall;
  if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !ready){
    rows.push(`<div><span style="color:var(--amber);">i</span> On iPhone or iPad: tap Share, then Add to Home Screen</div>`);
  }else{

async function loadSubjects(){

async function loadDownloads(){
  const missing = Object.keys(myImports).filter(id => !deckById.has(id));
  if(!missing.length) return;
  downloadsLoading = true;

/* ---------- deck helpers ---------- */
function deckTags(d){
  if(Array.isArray(d.tags) && d.tags.length) return d.tags.map(String).map(s => s.trim()).filter(Boolean);
  return [];
}
function deckSubjectName(d){ return d.subjectName || d.subject || ""; }
function matchesSearch(d, q){
  if(!q) return true;
  const hay = [d.title, d.description, d.ownerName, deckSubjectName(d), ...deckTags(d)].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}
function filteredDecks(){
  const q = searchQuery.trim().toLowerCase();
  return allDecks.filter(d => {
    if(activeSubject !== "All" && d.subjectId !== activeSubject && deckSubjectName(d) !== activeSubject) return false;
    if(hideImported && myImports[d.id]) return false;
    return matchesSearch(d, q);
  });
}
function groupByTag(decks){
  const map = new Map();
  decks.forEach(d => {
    const tags = deckTags(d);
    const keys = tags.length ? tags : ["Uncategorized"];
    keys.forEach(t => {
      if(!map.has(t)) map.set(t, []);
      if(!map.get(t).find(x => x.id === d.id)) map.get(t).push(d);
    });
  });
  return Array.from(map.entries()).sort((a, b) => {
    if(a[0] === "Uncategorized") return 1;
    if(b[0] === "Uncategorized") return -1;
    return a[0].localeCompare(b[0]);
  });
}
function renderGroupsByTag(decks, cardFn){
  return groupByTag(decks).map(([tag, list]) => `
    <section>
      <h2 class="subject-head"><span class="prompt">#</span> ${esc(tag)} <span class="cnt">${list.length}</span></h2>
      <div class="deck-grid">${list.map(cardFn).join("")}</div>
    </section>
  `).join("");
}
function subjectOptionsHTML(selected){
  if(!allSubjects.length) return `<option value="">— no subjects yet, ask an admin —</option>`;
  return `<option value="">— pick a subject —</option>` + allSubjects.map(s =>
    `<option value="${esc(s.id)}"${selected === s.id ? " selected" : ""}>${esc(s.name)}</option>`
  ).join("");
}
function tagsForSubject(subjectId){ const s = subjectById.get(subjectId); return s && Array.isArray(s.tags) ? s.tags : []; }
function uniqueSubjectsForChips(){
  const set = new Set();
  allSubjects.forEach(s => set.add(s.id));
  return Array.from(set).sort((a, b) => {
    const an = (subjectById.get(a) || {}).name || a, bn = (subjectById.get(b) || {}).name || b;
    return an.localeCompare(bn);
  });
}

/* ---------- admin ---------- */
function peopleLists(){
  const map = new Map();
  allDecksRaw.forEach(d => {
    const uid = ownerOf(d); if(!uid) return;
    if(!map.has(uid)) map.set(uid, { uid, name: d.ownerName || "anonymous", decks: 0, imports: 0 });
    const p = map.get(uid); p.decks++; p.imports += (d.importCount || 0);
  });
  Object.keys(badges).forEach(uid => {
    if(hasRole(uid) && !map.has(uid)) map.set(uid, { uid, name: "(no uploads yet)", decks: 0, imports: 0 });
  });
  if(!map.has(SUPER_ADMIN_UID)) map.set(SUPER_ADMIN_UID, { uid: SUPER_ADMIN_UID, name: "Owner", decks: 0, imports: 0 });
  const all = Array.from(map.values()).sort((a, b) => b.imports - a.imports || a.name.localeCompare(b.name));
  return { roles: all.filter(p => hasRole(p.uid)), uploaders: all.filter(p => !hasRole(p.uid)) };
}

async function sendTagRequest(subjectId){
  const name = (document.getElementById("reqTagName").value || "").trim().slice(0, 40);
  const errEl = document.getElementById("reqErr");
  if(name.length < 1){ errEl.textContent = "Give the tag a name."; return; }
  const existing = tagsForSubject(subjectId).map(t => t.toLowerCase());
  if(existing.includes(name.toLowerCase())){ errEl.textContent = "That tag already exists under this subject."; return; }
  try{
    const id = `tag_${subjectId}_${slugify(name)}_${currentUser.uid}`;
    await setDoc(doc(db, "tag_requests", id), {
      type: "tag", subjectId, requestedName: name,
      requestedBy: currentUser.uid,
      requestedByName: reporterName(),
      status: "open", createdAt: serverTimestamp()
    });

async function approveTagRequest(reqId){
  const r = openTagRequests.find(x => x.id === reqId);
  if(!r) return;
  try{
    if(r.type === "subject"){
      const slug = slugify(r.requestedName);
      await setDoc(doc(db, "subjects", slug), {
        name: r.requestedName, slug, tags: [],
        createdAt: serverTimestamp(), createdBy: currentUser.uid
      }, { merge: true });
      await writeApprovalNotification(r.requestedBy, "Subject approved", `Your requested subject "${r.requestedName}" was added.`);
    }else{
      const s = subjectById.get(r.subjectId);
      if(!s){ toast("Subject no longer exists"); return; }
      const tags = Array.from(new Set([...(s.tags || []), r.requestedName]));
      await updateDoc(doc(db, "subjects", r.subjectId), { tags });
      await writeApprovalNotification(r.requestedBy, "Tag approved", `Your requested tag "${r.requestedName}" was added under "${s.name}".`);
    }
    await updateDoc(doc(db, "tag_requests", reqId), { status: "approved", resolvedAt: serverTimestamp(), resolvedBy: currentUser.uid });
    toast("Request approved");
    await loadSubjects(); await loadTagRequests();
  }catch(e){ adminError(e); }
}
async function rejectTagRequest(reqId){
  try{
    await updateDoc(doc(db, "tag_requests", reqId), { status: "rejected", resolvedAt: serverTimestamp(), resolvedBy: currentUser.uid });
    toast("Request rejected");
    await loadTagRequests();
  }catch(e){ adminError(e); }
}

    await setDoc(ref, { uid, title, body, read: false, createdAt: serverTimestamp() });

}

/* ---------- admin actions ---------- */
function adminError(e){
  console.error(e);
  toast((e && e.code === "permission-denied") ? "Permission denied. Check the library rules in Firebase." : "Something went wrong.");
}
function hasAnyFlag(b){ return !!b && (b.verified === true || b.admin === true || b.teacher === true); }
function hasRole(uid){ return isAdminUid(uid) || hasAnyFlag(badges[uid]); }
async function setBadge(uid, field, value){
  if(!uid) return;
  try{
    const next = Object.assign({}, badges[uid] || {}, { [field]: value });
    if(hasAnyFlag(next)){
      await setDoc(doc(db, "badges", uid), { [field]: value }, { merge: true });
      badges[uid] = next;
    }else{
      if(badges[uid]) await deleteDoc(doc(db, "badges", uid));
      delete badges[uid];
    }
    const msg = { verified: ["Blue check given", "Blue check removed"], teacher: ["Teacher badge given", "Teacher badge removed"], admin: ["Admin added", "Admin removed"] }[field];
    toast(msg ? (value ? msg[0] : msg[1]) : "Updated");
    render();
  }catch(e){ adminError(e); }
}
let badgesCleaned = false;
async function cleanupStaleBadges(){
  if(badgesCleaned || !isMeAdmin()) return;
  badgesCleaned = true;
  const stale = Object.keys(badges).filter(uid => !hasAnyFlag(badges[uid]));
  for(const uid of stale){
    try{ await deleteDoc(doc(db, "badges", uid)); delete badges[uid]; }catch(e){ console.warn(e); }
  }
  if(stale.length) render();
}

/* ---------- deck structure ---------- */
const LIM = { subjects: 10, topicsPer: 30, cards: 500, notes: 100, subjectName: 40, topicName: 60, q: 600, a: 1500, noteTitle: 100, noteBody: 4000, docBytes: 900000 };
function normQ(q){ return (q || "").trim().toLowerCase().replace(/\s+/g, " "); }
const rid = () => Math.random().toString(36).slice(2, 8);

function deckStructure(d){
  if(d && Array.isArray(d.subjects) && d.subjects.length) return d.subjects;
  const cards = ((d && d.cards) || []).map(c => ({ q: c.q || c.question || "", a: c.a || c.answer || "" })).filter(c => c.q && c.a);
  return [{ name: (d && d.subject) || "Imported", topics: [{ name: (d && d.title) || "Imported Deck", cards, notes: [] }] }];
}
function structureCounts(st){
  let cards = 0, notes = 0, topics = 0;
  (st || []).forEach(s => (s.topics || []).forEach(t => { topics++; cards += (t.cards || []).length; notes += (t.notes || []).length; }));
  return { subjects: (st || []).length, topics, cards, notes };
}
function flatCards(d){
  const out = [];
  deckStructure(d).forEach(s => (s.topics || []).forEach(t => (t.cards || []).forEach(c => out.push(c))));
  return out;
}
function sanitizeStructure(st){
  const out = [];
  let cards = 0, notes = 0;
  for(const s of (st || [])){
    const sn = String(s.name || "").trim().slice(0, LIM.subjectName);
    if(!sn) continue;
    const topics = [];
    for(const t of (s.topics || []).slice(0, LIM.topicsPer)){
      const tn = String(t.name || "General").trim().slice(0, LIM.topicName) || "General";
      const cs = [], ns = [];
      for(const c of (t.cards || [])){
        const q = String(c.q || "").trim().slice(0, LIM.q), a = String(c.a || "").trim().slice(0, LIM.a);
        if(q && a) cs.push({ q, a });
      }
      for(const n of (t.notes || [])){
        const title = String(n.title || "").trim().slice(0, LIM.noteTitle) || "Untitled";
        const content = String(n.content || "").trim().slice(0, LIM.noteBody);
        if(content) ns.push({ title, content });
      }
      if(cs.length || ns.length){ topics.push({ name: tn, cards: cs, notes: ns }); cards += cs.length; notes += ns.length; }
    }
    if(topics.length) out.push({ name: sn, topics });
  }
  if(out.length > LIM.subjects) return { error: `Too many subjects (max ${LIM.subjects}).` };
  if(cards > LIM.cards) return { error: `Too many flashcards (max ${LIM.cards} per deck).` };
  if(notes > LIM.notes) return { error: `Too many notes (max ${LIM.notes} per deck).` };
  return { structure: out, cards, notes };
}

/* ---------- backup format ---------- */
function backupFromDeck(d, target){
  const flashcards = {}, notes = {}, topics = {};
  const now = new Date().toISOString();
  deckStructure(d).forEach(s => {
    const name = (target && target.subject) || s.name || "Imported";
    flashcards[name] = flashcards[name] || []; notes[name] = notes[name] || []; topics[name] = topics[name] || [];
    (s.topics || []).forEach(t => {
      const tn = (target && target.topic) || t.name || "General";
      if(!topics[name].includes(tn)) topics[name].push(tn);
      (t.cards || []).forEach(c => flashcards[name].push({ question: c.q, answer: c.a, topic: tn, review_count: 0, last_reviewed: null, created: now }));
      (t.notes || []).forEach(n => notes[name].push({ id: "note_" + rid() + rid(), title: n.title || "Untitled", content: n.content || "", topic: tn, created: now }));
    });
  });
  return { type: "d4n_study_backup", version: 3, exported_at: now, flashcards, notes, topics, study_sessions: [] };
}
function downloadDeckFile(d, target){
  const blob = new Blob([JSON.stringify(backupFromDeck(d, target), null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${slugify(d.title)}-kite-deck.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ---------- import into K.I.T.E account ---------- */
const FAIL_KEY = "kite_lib_import_fails_v1";
let failedDeck = null, failedInfo = null, failedTarget = null;
let importCtx = null;
function failSignature(e){ return String((e && e.code) || (e && e.message) || "unknown").slice(0, 80); }
function bumpFailure(sig){
  let o = {};
  try{ o = JSON.parse(localStorage.getItem(FAIL_KEY) || "{}"); }catch(e){}
  o[sig] = (o[sig] || 0) + 1;
  try{ localStorage.setItem(FAIL_KEY, JSON.stringify(o)); }catch(e){}
  return o[sig];
}
function clearFailures(){ try{ localStorage.removeItem(FAIL_KEY); }catch(e){} }
function persistLocalImports(){ try{ localStorage.setItem(IMPORTS_LS_KEY, JSON.stringify(myImports)); }catch(e){} }

async function doImportDeck(deck, btn, target){
  if(!currentUser){ toast("Please sign in first"); showLogin(); return; }
  const d = deck || currentDeck;
  if(!d) return;
  const idleLabel = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Importing…"; }
  try{
    const ref = doc(db, "study_data", currentUser.uid);
    const snap = await getDoc(ref);
    const data = snap.exists() ? snap.data() : {};
    data.flashcards = data.flashcards || {}; data.notes = data.notes || {};
    data.topics = data.topics || {}; data.study_sessions = data.study_sessions || [];
    const payload = backupFromDeck(d, target);
    let addedCards = 0, addedNotes = 0;
    for(const subject in payload.flashcards){
      data.flashcards[subject] = data.flashcards[subject] || [];
      data.notes[subject] = data.notes[subject] || [];
      data.topics[subject] = data.topics[subject] || [];
      const seenQ = new Set(data.flashcards[subject].map(c => normQ(c.question)));
      payload.flashcards[subject].forEach(c => {
        const k = normQ(c.question);
        if(seenQ.has(k)) return;
        data.flashcards[subject].push(c); seenQ.add(k); addedCards++;
      });
      const seenN = new Set(data.notes[subject].map(n => normQ(n.title) + "|" + normQ(n.content).slice(0, 60)));
      (payload.notes[subject] || []).forEach(n => {
        const k = normQ(n.title) + "|" + normQ(n.content).slice(0, 60);
        if(seenN.has(k)) return;
        data.notes[subject].push(n); seenN.add(k); addedNotes++;
      });
      (payload.topics[subject] || []).forEach(t => { if(!data.topics[subject].includes(t)) data.topics[subject].push(t); });
    }
    await setDoc(ref, { ...data, updatedAt: serverTimestamp() });
    clearFailures();

    // Local-first bookkeeping so Downloads always shows the import
    if(d.id){
      const alreadyImported = !!myImports[d.id];
      myImports[d.id] = new Date();
      persistLocalImports();
      try{
        await updateDoc(doc(db, "users", currentUser.uid), { ["importedDecks." + d.id]: serverTimestamp() });
      }catch(e){ console.warn("Could not record the import on the server:", e); }
      if(!alreadyImported && ownerOf(d) !== currentUser.uid){
        try{
          await updateDoc(doc(db, "public_decks", d.id), { importCount: increment(1) });
          d.importCount = (d.importCount || 0) + 1;
        }catch(e){ console.warn("Could not update the download count:", e); }
      }
    }
    const parts = [`${addedCards} card${addedCards === 1 ? "" : "s"}`];
    if(addedNotes) parts.push(`${addedNotes} note${addedNotes === 1 ? "" : "s"}`);
    toast(`Imported ${parts.join(" and ")} into ${target && target.subject ? target.subject : "K.I.T.E"}`);
    closeModal();
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = "Imported"; }
    render();
  }catch(e){
    console.error(e);
    if(btn){ btn.disabled = false; btn.textContent = idleLabel; }
    handleImportFailure(d, e, target);
  }
}
function handleImportFailure(d, e, target){
  const sig = failSignature(e);
  const count = bumpFailure(sig);
  try{ downloadDeckFile(d, target); }catch(err){ console.warn("Fallback download failed:", err); }
  failedDeck = d; failedTarget = target || null;
  failedInfo = { sig, message: String((e && e.message) || sig).slice(0, 200), count };
  showImportFailed();
}
function showImportFailed(){
  const f = failedInfo, d = failedDeck;
  if(!f || !d) return;
  const again = f.count >= 2;
  openModal(`
    <div class="modal term" role="dialog" aria-modal="true" aria-label="Import failed">
      <div class="titlebar">${dotsHTML()}<span class="path">import-failed</span><button class="titlebar-back" id="closeModal">close</button></div>
      <div class="modal-body">
        <h2 style="color:var(--red);">Couldn't connect to your K.I.T.E account</h2>
        <div class="note" style="margin:0 0 10px;">Error: ${esc(f.sig)}</div>
        <div class="desc-block">We downloaded "${esc(d.title || "this deck")}" to your device instead. To add it yourself: open K.I.T.E, go to Import / Export, choose Import, and pick the file.</div>
        ${again ? `<div class="note" style="margin:0 0 12px;color:var(--amber);">This has happened ${f.count} times now. If it keeps going wrong, send a report so an admin can look into it.</div>` : ""}
        <div class="modal-actions">
          ${again ? `<button class="btn btn-danger sm" data-mact="importFailedReport">Report this problem</button>` : ""}
          <button class="btn btn-ghost sm" data-mact="importFailedDownload">Download again</button>
          <button class="btn btn-primary sm" id="cancelImportBtn">Close</button>
        </div>
      </div>
    </div>`);
  attachModal();
}

async function loadMySubjects(){
  const ctx = importCtx; if(!ctx) return;
  const subjects = {};
  let failed = false;
  try{
    const snap = await getDoc(doc(db, "study_data", currentUser.uid));
    const data = snap.exists() ? snap.data() : {};
    const names = new Set([...Object.keys(data.flashcards || {}), ...Object.keys(data.topics || {}), ...Object.keys(data.notes || {})]);
    names.forEach(n => {
      const t = new Set((data.topics && data.topics[n]) || []);
      ((data.flashcards && data.flashcards[n]) || []).forEach(c => { if(c.topic) t.add(c.topic); });
      ((data.notes && data.notes[n]) || []).forEach(x => { if(x.topic) t.add(x.topic); });
      subjects[n] = Array.from(t).sort();
    });
  }catch(e){ failed = true; }
  if(importCtx !== ctx) return;
  ctx.subjects = subjects;
  const radio = document.getElementById("impExistingRadio"), note = document.getElementById("impExistingNote");
  if(!radio) return;
  const names = Object.keys(subjects).sort();
  if(!names.length){ if(note) note.textContent = failed ? "— couldn't load your subjects" : "— you don't have any subjects yet"; return; }
  radio.disabled = false;
  if(note) note.textContent = `— ${plural(names.length, "subject")} found`;
  document.getElementById("impSubject").innerHTML = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  fillImportTopics();
}
function fillImportTopics(){
  const ctx = importCtx;
  if(!ctx || !ctx.subjects) return;
  const sub = document.getElementById("impSubject").value;
  const topics = ctx.subjects[sub] || [];
  document.getElementById("impTopic").innerHTML =
    `<option value="__keep__">Keep the deck's own topics</option>` +
    topics.map(t => `<option value="${esc(t)}">Put everything in: ${esc(t)}</option>`).join("") +
    `<option value="__new__">A new topic…</option>`;
  updateImportFields();
}
function updateImportFields(){
  const mode = (document.querySelector('input[name="impMode"]:checked') || {}).value;
  const f = document.getElementById("impFields");
  if(f) f.style.display = mode === "existing" ? "" : "none";
  const t = document.getElementById("impTopic"), w = document.getElementById("impNewTopicWrap");
  if(w) w.style.display = (mode === "existing" && t && t.value === "__new__") ? "" : "none";
}
function confirmImport(btn){
  const ctx = importCtx; if(!ctx) return;
  const mode = (document.querySelector('input[name="impMode"]:checked') || {}).value;
  let target = null;
  if(mode === "existing"){
    const subject = document.getElementById("impSubject").value;
    const tv = document.getElementById("impTopic").value;
    let topic = null;
    if(tv === "__new__"){
      topic = (document.getElementById("impNewTopic").value || "").trim().slice(0, LIM.topicName);
      if(!topic){ document.getElementById("impErr").textContent = "Type a name for the new topic."; return; }
    }else if(tv !== "__keep__") topic = tv;
    target = { subject, topic };
  }
  doImportDeck(ctx.deck, btn, target);
}

/* ---------- publishing ---------- */
async function publishDeck(structure, meta){
  if(!currentUser) throw new Error("Sign in first.");
  const clean = sanitizeStructure(structure);
  if(clean.error) throw new Error(clean.error);
  const counts = structureCounts(clean.structure);
  if(!counts.cards) throw new Error("Add at least one flashcard first.");
  const title = String(meta.title || "").trim().slice(0, 80);
  if(title.length < 3) throw new Error("Give the deck a title (at least 3 characters).");
  const subjectId = String(meta.subjectId || "").trim();
  if(!subjectId) throw new Error("Pick a subject.");
  const s = subjectById.get(subjectId);
  if(!s) throw new Error("That subject no longer exists. Pick another.");
  const tags = (meta.tagIds || []).map(normTag).filter(Boolean);
  if(!tags.length) throw new Error("Pick at least one tag.");
  // Validate tags belong to the subject
  const allowed = new Set((s.tags || []).map(t => t.toLowerCase()));
  const bad = tags.filter(t => !allowed.has(t.toLowerCase()));
  if(bad.length) throw new Error(`These tags aren't under "${s.name}": ${bad.join(", ")}`);
  // Dedupe case-insensitively, keep original casing
  const seen = new Set(), finalTags = [];
  tags.forEach(t => { const k = t.toLowerCase(); if(!seen.has(k)){ seen.add(k); finalTags.push(t); } });
  const data = {
    title, description: String(meta.description || "").trim().slice(0, 500),
    subjectId, subjectName: s.name,
    tags: finalTags,
    subjects: clean.structure, cardCount: counts.cards, noteCount: counts.notes,
    importCount: 0, ownerUid: currentUser.uid, ownerName: (myProfile && myProfile.username) || currentUser.displayName || "anonymous",
    createdAt: serverTimestamp(), hidden: false
  };
  if(JSON.stringify(data).length > LIM.docBytes) throw new Error("This deck is too big to publish. Remove some cards or notes.");
  const ref = doc(collection(db, "public_decks"));
  await setDoc(ref, data);
  const saved = Object.assign({ id: ref.id }, data, { createdAt: new Date() });
  allDecksRaw.unshift(saved); allDecks = allDecksRaw.filter(d => !d.hidden); deckById.set(saved.id, saved);
  return saved;
}

/* ---------- Upload Deck ---------- */
let uploadState = null;
function parseCSV(text){
  const first = text.split(/\r?\n/).find(l => l.trim() && !l.startsWith("#")) || "";
  const delim = first.includes("\t") ? "\t" : (first.includes(",") ? "," : (first.includes(";") ? ";" : ","));
  const rows = []; let row = [], cur = "", inQ = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQ){ if(ch === '"'){ if(text[i + 1] === '"'){ cur += '"'; i++; } else inQ = false; } else cur += ch; }
    else if(ch === '"' && cur === ""){ inQ = true; }
    else if(ch === delim){ row.push(cur); cur = ""; }
    else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; rows.push(row); row = []; }
    else cur += ch;
  }
  if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function cardsFromRows(rows){
  const out = [];
  rows.forEach((r, i) => {
    if(!r.length || String(r[0]).trim().startsWith("#")) return;
    const q = String(r[0] || "").trim(), a = String(r[1] || "").trim(), t = String(r[2] || "").trim();
    if(!q || !a) return;
    if(i === 0 && /^(question|front|q)$/i.test(q) && /^(answer|back|a)$/i.test(a)) return;
    out.push({ q, a, t });
  });
  return out;
}
function structureFromBackup(p){
  const names = new Set([...Object.keys(p.flashcards || {}), ...Object.keys(p.notes || {})]);
  const out = [];
  names.forEach(name => {
    const byTopic = new Map();
    const get = t => { const k = t || "General"; if(!byTopic.has(k)) byTopic.set(k, { name: k, cards: [], notes: [] }); return byTopic.get(k); };
    (p.flashcards[name] || []).forEach(c => { if(c && c.question && c.answer) get(c.topic).cards.push({ q: String(c.question), a: String(c.answer) }); });
    ((p.notes && p.notes[name]) || []).forEach(n => { if(n && n.content) get(n.topic).notes.push({ title: String(n.title || "Untitled"), content: String(n.content) }); });
    const topics = Array.from(byTopic.values());
    if(topics.length) out.push({ name, topics });
  });
  return out;
}
function parseUploadText(fileName, text){
  const base = fileName.replace(/\.[^/.]+$/, "").slice(0, 80);
  const lower = fileName.toLowerCase();
  if(lower.endsWith(".json")){
    let p;
    try{ p = JSON.parse(text); }catch(e){ return { error: "That file isn't valid JSON." }; }
    if(p && (p.flashcards || p.notes) && !Array.isArray(p.flashcards)){
      const st = structureFromBackup({ flashcards: p.flashcards || {}, notes: p.notes || {} });
      if(!st.length) return { error: "No flashcards or notes found in that backup." };
      return { kind: "backup", title: base, structure: st };
    }
    let list = Array.isArray(p) ? p : (Array.isArray(p && p.cards) ? p.cards : null);
    if(!list) return { error: "Couldn't find any flashcards in that file." };
    const cards = list.map(c => ({ q: String(c.q || c.question || "").trim(), a: String(c.a || c.answer || "").trim(), t: String(c.topic || c.t || "").trim() })).filter(c => c.q && c.a);
    if(!cards.length) return { error: "Couldn't find any flashcards in that file." };
    return { kind: "cards", title: (p && p.title) || base, cards };
  }
  const cards = cardsFromRows(parseCSV(text));
  if(!cards.length) return { error: "No flashcards found. Use one card per line: question, answer, and an optional topic." };
  return { kind: "cards", title: base, cards };
}

function handleUploadFile(file){
  const body = document.getElementById("uploadBody");
  if(!file || !body) return;
  if(file.size > 2 * 1024 * 1024){ body.innerHTML = uploadPickHTML("That file is bigger than 2 MB."); return; }
  const reader = new FileReader();
  reader.onerror = () => { body.innerHTML = uploadPickHTML("Couldn't read that file."); };
  reader.onload = ev => {
    const parsed = parseUploadText(file.name, String(ev.target.result || ""));
    if(parsed.error){ body.innerHTML = uploadPickHTML(parsed.error); return; }
    uploadState = Object.assign({ fileName: file.name }, parsed);
    body.innerHTML = uploadReviewHTML();
    // Wire subject → tag picker
    const subjSel = document.getElementById("upSubject");
    if(subjSel) subjSel.addEventListener("change", () => renderTagPicker("upTags", subjSel.value, []));
  };
  reader.readAsText(file);
}
function uploadStructure(){

  if(u.kind === "backup"){
    const picked = Array.from(document.querySelectorAll("#uploadBody [data-sub]")).filter(c => c.checked).map(c => parseInt(c.dataset.sub, 10));

  return [{ name: subjectName, topics: Array.from(by.entries()).map(([name, cards]) => ({ name, cards, notes: [] })) }];
}

function hydrateCreateTagPicker(){
  const sel = document.getElementById("createSubject");
  if(!sel) return;

function draftAction(act, arg, el){
  const row = el.closest(".add-row");
  const val = n => { const i = row && row.querySelector(`[data-in="${n}"]`); return i ? String(i.value || "").trim() : ""; };
  switch(act){
    case "addSubject": {
      const name = val("newSubject").slice(0, LIM.subjectName);
      if(!name){ toast("Type a subject name first"); return; }
      if(draft.subjects.length >= LIM.subjects){ toast(`Max ${LIM.subjects} subjects per deck`); return; }
      if(draft.subjects.some(s => s.name.toLowerCase() === name.toLowerCase())){ toast("That subject is already there"); return; }
      const s = { id: rid(), name, topics: [] }; draft.subjects.push(s);
      pendingFocus = `[data-subject="${s.id}"] [data-in="newTopic"]`; break;
    }
    case "removeSubject": draft.subjects = draft.subjects.filter(s => s.id !== arg); break;
    case "addTopic": {
      const s = draft.subjects.find(x => x.id === arg); if(!s) return;
      const name = val("newTopic").slice(0, LIM.topicName);
      if(!name){ toast("Type a topic name first"); return; }
      if(s.topics.length >= LIM.topicsPer){ toast(`Max ${LIM.topicsPer} topics per subject`); return; }
      if(s.topics.some(t => t.name.toLowerCase() === name.toLowerCase())){ toast("That topic is already there"); return; }
      const t = { id: rid(), name, cards: [], notes: [] }; s.topics.push(t);
      pendingFocus = `[data-topic="${t.id}"] [data-in="cardQ"]`; break;
    }
    case "removeTopic": draft.subjects.forEach(s => { s.topics = s.topics.filter(t => t.id !== arg); }); break;
    case "addCard": {
      const f = findTopic(arg); if(!f) return;
      const q = val("cardQ"), a = val("cardA");
      if(!q || !a){ toast("Fill in both the question and the answer"); return; }
      if(draftTotals().cards >= LIM.cards){ toast(`Max ${LIM.cards} flashcards per deck`); return; }
      f.t.cards.push({ q, a });
      pendingFocus = `[data-topic="${f.t.id}"] [data-in="cardQ"]`; break;
    }
    case "removeCard": { const [tid, i] = arg.split("|"); const f = findTopic(tid); if(f) f.t.cards.splice(parseInt(i, 10), 1); break; }
    case "addNote": {
      const f = findTopic(arg); if(!f) return;
      const title = val("noteTitle"), content = val("noteBody");
      if(!content){ toast("Write the note first"); return; }
      if(draftTotals().notes >= LIM.notes){ toast(`Max ${LIM.notes} notes per deck`); return; }
      f.t.notes.push({ title: title || "Untitled", content }); break;
    }
    case "removeNote": { const [tid, i] = arg.split("|"); const f = findTopic(tid); if(f) f.t.notes.splice(parseInt(i, 10), 1); break; }
  }
  saveDraft(); render();
  hydrateCreateTagPicker();
}
async function publishFromDraft(btn){

  draft.subjectId = subjectId; draft.tagIds = tagIds; saveDraft();
  if(btn){ btn.disabled = true; btn.textContent = "Publishing…"; }
  try{
    const saved = await publishDeck(draftStructure(), draft);
    draft = blankDraft(); saveDraft();
    toast(`Published "${saved.title}"`);
    go("uploads");
  }catch(e){
    toast((e && e.code === "permission-denied") ? "Couldn't publish (permission denied). Check the library rules in Firebase." : ((e && e.message) || "Couldn't publish."));
    if(btn){ btn.disabled = false; btn.textContent = "Publish deck"; }
  }
}
function importFromDraft(btn){

/* ---------- PC: hovering a deck pulses its lights ---------- */
const canHover = !!(window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches);
const hoverRuns = new WeakMap();
function pulseCard(card){
  if(hoverRuns.has(card)) return;
  const dots = Array.from(card.querySelectorAll(".dot[data-dot]"));
  const timers = [];
  hoverRuns.set(card, timers);
  let t = 0;
  dotShow.FRAMES.forEach(([blues, ms]) => {
    const at = t;
    timers.push(setTimeout(() => dots.forEach(d => d.classList.toggle("hint", blues.includes(parseInt(d.dataset.dot, 10)))), at));
    t += ms;
  });
  timers.push(setTimeout(() => hoverRuns.delete(card), t + 80));
}

/* ---------- badge tooltips ---------- */
function placeBadgeTip(b){
  const r = b.getBoundingClientRect();
  const win = b.closest(".term");
  const box = (win || document.documentElement).getBoundingClientRect();
  const leftSpace = r.left - Math.max(0, box.left);
  const rightSpace = Math.min(window.innerWidth, box.right) - r.right;
  b.classList.remove("tip-l", "tip-r", "tip-c", "tip-up", "tip-down");
  b.classList.add(leftSpace < 95 ? "tip-l" : (rightSpace < 95 ? "tip-r" : "tip-c"));
  b.classList.add((win || r.top < 70) ? "tip-down" : "tip-up");
}

function go(v, fromHash){
  if(!authReady){ pendingView = v; return; }

  if(v === "admin" && !isMeAdmin()) v = "home";

  if(!fromHash) location.hash = (v === "home" ? "" : v);

/* ---------- events ---------- */
const appEl = document.getElementById("app");
appEl.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  switch(act){
    case "nav": closeSidebar(); go(arg); break;
    case "menu": {
      const sb = document.getElementById("sidebar"), bd = document.getElementById("sbBackdrop");
      if(sb) sb.classList.add("open"); if(bd) bd.classList.add("show");
      break;
    }
    case "closeMenu": closeSidebar(); break;
    case "hideImported":
      if(!currentUser){ toast("Sign in to use this"); showLogin(); break; }
      hideImported = !hideImported;
      try{ localStorage.setItem(HIDE_KEY, hideImported ? "1" : "0"); }catch(err){}
      go("home"); break;
    case "theme": showThemes(); break;
    case "showNotifs": showNotificationsModal(); break;
    case "pwaInstall": doInstallApp(); break;
    case "openUpload": closeSidebar(); showUploadModal(); break;
    case "newDeck": go("create"); break;
    case "requestSubject": showRequestSubjectModal(); break;
    case "requestTag": {
      // Figure out the current subject from whichever page triggered it
      let subjectId = "";
      if(view === "create"){ const s = document.getElementById("createSubject"); subjectId = s ? s.value : draft.subjectId; }
      else { const s = document.getElementById("upSubject"); if(s) subjectId = s.value; }
      if(!subjectId){ toast("Pick a subject first"); return; }
      showRequestTagModal(subjectId);
      break;
    }
    case "addSubject": if(view === "admin"){ adminAddSubject(); } else { draftAction(act, arg, el); } break;
    case "removeSubject": case "addTopic": case "removeTopic":
    case "addCard": case "removeCard": case "addNote": case "removeNote":
      draftAction(act, arg, el); break;
    case "publishDraft": publishFromDraft(el); break;
    case "importDraft": importFromDraft(el); break;
    case "clearDraft": if(confirm("Clear this draft? This can't be undone.")){ draft = blankDraft(); saveDraft(); render(); } break;
    case "dismissReport": dismissReport(arg); break;
    case "hideUserDecks": hideUsersDecks(arg); break;
    case "approveTagReq": approveTagRequest(arg); break;
    case "rejectTagReq": rejectTagRequest(arg); break;
    case "addTag": adminAddTag(arg, el); break;
    case "deleteTag": { const [s, t] = arg.split("|"); adminDeleteTag(s, t); break; }
    case "deleteSubject": adminDeleteSubject(arg); break;
    case "signin": showLogin(); break;
    case "signout": doSignOut(); break;
    case "login": doLogin(); break;
    case "forgot": doForgot(); break;
    case "backBrowse": showingLogin = false; pendingView = null; render(); break;
    case "subject": activeSubject = arg; render(); break;
    case "preview": { const d = deckById.get(arg); if(!d) return; currentDeck = d; openModal(renderDeckPreview(d)); attachModal(); break; }
    case "import": { const d = deckById.get(arg); if(!d) return; showImportChooser(d); break; }
    case "adminVerify": setBadge(arg, "verified", !(badges[arg] && badges[arg].verified === true)); break;
    case "adminAdmin":  setBadge(arg, "admin", !isAdminUid(arg)); break;
    case "adminTeacher": setBadge(arg, "teacher", !(badges[arg] && badges[arg].teacher === true)); break;
    case "adminHide":   { const d = deckById.get(arg); setDeckHidden(arg, !(d && d.hidden)); break; }
    case "adminDelete": deleteDeckAdmin(arg); break;
    case "grantVerify": case "grantAdmin": case "grantTeacher": {
      const input = document.getElementById("grantUid");
      const uid = input ? input.value.trim() : "";
      if(uid.length < 20){ toast("Paste the full Firebase UID"); break; }
      setBadge(uid, act === "grantVerify" ? "verified" : (act === "grantTeacher" ? "teacher" : "admin"), true);
      break;
    }
  }
});
appEl.addEventListener("change", e => {
  if(e.target.id === "createSubject"){
    draft.subjectId = e.target.value; draft.tagIds = []; saveDraft();
    renderTagPicker("createTags", draft.subjectId, []);
  }
  if(e.target.id === "uploadFile"){ /* handled by modal change listener */ }
});
let searchTimer;
appEl.addEventListener("input", e => {
  const field = e.target.dataset && e.target.dataset.draft;
  if(field){ draft[field] = e.target.value; saveDraft(); return; }
  if(e.target.id !== "searchInput") return;
  const input = e.target;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = input.value;
    const pos = input.selectionStart;
    render();
    const ni = document.getElementById("searchInput");
    if(ni){ ni.focus(); try{ ni.setSelectionRange(pos, pos); }catch(err){} }
  }, 120);
});
appEl.addEventListener("keydown", e => {
  if(e.target.id === "loginPassword" && e.key === "Enter"){ doLogin(); return; }
  if(e.key === "Enter" && e.target.tagName === "INPUT" && e.target.closest(".add-row")){
    const row = e.target.closest(".add-row");
    const fields = Array.from(row.querySelectorAll("input, textarea"));
    const i = fields.indexOf(e.target);
    e.preventDefault();
    if(i < fields.length - 1) fields[i + 1].focus(); else { const b = row.querySelector("[data-act]"); if(b) b.click(); }
  }
});

/* modal events */
const modalEl = document.getElementById("modalOverlay");
modalEl.addEventListener("click", e => {
  if(!e.target.closest(".report-wrap")) document.querySelectorAll(".report-wrap.open").forEach(w => w.classList.remove("open"));
  const el = e.target.closest("[data-mact]");
  if(!el) return;
  switch(el.dataset.mact){
    case "reportMenu": el.closest(".report-wrap").classList.toggle("open"); break;
    case "importConfirm": confirmImport(el); break;
    case "readNotif": markNotificationRead(el.dataset.arg); break;
    case "requestSubject": showRequestSubjectModal(); break;
    case "requestTag": { const s = document.getElementById("upSubject"); if(s && s.value) showRequestTagModal(s.value); else toast("Pick a subject first"); break; }
    case "sendReqSubject": sendSubjectRequest(); break;
    case "sendReqTag": sendTagRequest(el.dataset.arg); break;
    case "reportDeck": {
      if(!currentUser){ toast("Sign in to report"); closeModal(); showLogin(); break; }
      const d = currentDeck; if(!d) break;
      showReportModal("deck", { id: d.id, name: d.title, deckId: d.id, ownerUid: ownerOf(d), ownerName: d.ownerName });
      break;
    }
    case "reportUser": {
      if(!currentUser){ toast("Sign in to report"); closeModal(); showLogin(); break; }
      const d = currentDeck; if(!d) break;
      showReportModal("user", { id: ownerOf(d), name: d.ownerName || "anonymous" });
      break;
    }
    case "reportSend": sendPendingReport(); break;
    case "uploadPublish": doUploadPublish(); break;
    case "importFailedDownload": if(failedDeck) downloadDeckFile(failedDeck, failedTarget); break;
    case "importFailedReport": sendImportErrorReport(); break;
  }
});
modalEl.addEventListener("change", e => {
  if(e.target.id === "uploadFile") handleUploadFile(e.target.files[0]);
  else if(e.target.id === "impSubject") fillImportTopics();
  else if(e.target.name === "impMode" || e.target.id === "impTopic") updateImportFields();
  else if(e.target.id === "upSubject") renderTagPicker("upTags", e.target.value, []);
});
if(canHover){
  appEl.addEventListener("mouseover", e => {
    const card = e.target.closest(".deck-term");
    if(!card || (e.relatedTarget && card.contains(e.relatedTarget))) return;
    pulseCard(card);
  });
}
["pointerover", "focusin"].forEach(ev => document.addEventListener(ev, e => {
  const b = e.target.closest && e.target.closest(".badge");
  if(b) placeBadgeTip(b);
}));
window.addEventListener("hashchange", () => {
  const v = viewFromHash();
  if(v === view && !showingLogin) return;
  go(v, true);
});

/* ---------- auth state ---------- */
onAuthStateChanged(auth, async (user) => {
  authReady = true;
  currentUser = user;
  myProfile = null;
  if(user) showingLogin = false;
  if(!user && GATED.includes(view)) view = "home";
  render();
  if(user){
    await loadMyProfile();
    await loadNotifications();
    await badgesPromise;
    if(isMeAdmin()){ loadTagRequests(); loadReports(); }
  }else{
    myImports = {}; myNotifications = []; openTagRequests = [];
  }
  if(user && pendingView){ const v = pendingView; pendingView = null; go(v, true); }
  else if(!user && pendingView){ showLogin(); }
  else render();
  if(user && view === "downloads") loadDownloads();
});

/* ---------- init ---------- */
if(viewFromHash() !== "home") pendingView = viewFromHash();
const badgesPromise = loadBadges();
Promise.all([loadSubjects(), badgesPromise]).then(() => render());
loadDecks();

/* ---------- service worker ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Library SW registered"))
      .catch(err => console.warn("SW registration failed:", err));
  });
}

</script>
</body>
</html>
